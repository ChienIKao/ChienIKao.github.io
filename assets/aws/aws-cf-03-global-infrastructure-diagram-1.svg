<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
          <rect x="30" y="30" width="640" height="240" rx="18" fill="#F7F5EF" stroke="#24325C" stroke-width="1.2"/>
          <text x="50" y="60" font-family="IBM Plex Sans" font-weight="700" font-size="15" fill="#24325C">區域 Region(例:ap-northeast-1 東京)</text>
          <text x="50" y="80" font-family="IBM Plex Sans" font-size="11.5" fill="#565B52">一個地理區域,包含多個彼此隔離的可用區域</text>

          <rect x="60" y="105" width="180" height="140" rx="12" fill="#E1EEEB" stroke="#12665A"/>
          <text x="150" y="135" text-anchor="middle" font-family="IBM Plex Sans" font-weight="700" font-size="14" fill="#12665A">可用區域 A</text>
          <text x="150" y="160" text-anchor="middle" font-family="IBM Plex Sans" font-size="11.5" fill="#565B52">獨立電力</text>
          <text x="150" y="182" text-anchor="middle" font-family="IBM Plex Sans" font-size="11.5" fill="#565B52">獨立冷卻</text>
          <text x="150" y="204" text-anchor="middle" font-family="IBM Plex Sans" font-size="11.5" fill="#565B52">獨立網路</text>

          <rect x="260" y="105" width="180" height="140" rx="12" fill="#E1EEEB" stroke="#12665A"/>
          <text x="350" y="135" text-anchor="middle" font-family="IBM Plex Sans" font-weight="700" font-size="14" fill="#12665A">可用區域 B</text>
          <text x="350" y="160" text-anchor="middle" font-family="IBM Plex Sans" font-size="11.5" fill="#565B52">實體位置分離</text>
          <text x="350" y="182" text-anchor="middle" font-family="IBM Plex Sans" font-size="11.5" fill="#565B52">低延遲互連</text>
          <text x="350" y="204" text-anchor="middle" font-family="IBM Plex Sans" font-size="11.5" fill="#565B52">故障互相隔離</text>

          <rect x="460" y="105" width="180" height="140" rx="12" fill="#E1EEEB" stroke="#12665A"/>
          <text x="550" y="135" text-anchor="middle" font-family="IBM Plex Sans" font-weight="700" font-size="14" fill="#12665A">可用區域 C</text>
          <text x="550" y="160" text-anchor="middle" font-family="IBM Plex Sans" font-size="11.5" fill="#565B52">一個 AZ 由一或</text>
          <text x="550" y="182" text-anchor="middle" font-family="IBM Plex Sans" font-size="11.5" fill="#565B52">多個資料中心組成</text>
        </svg>
